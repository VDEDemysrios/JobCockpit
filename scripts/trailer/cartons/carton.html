<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Carton</title>
<style>
@font-face{font-family:'Inter Variable';src:url(fonts/inter-latin-wght-normal.woff2) format('woff2-variations');font-weight:100 900;}
:root{--bg:#080b10;--ink:#e4edf4;--muted:#7e8d99;--accent:#f0a020;--accent2:#38bdf8;}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Inter Variable',Inter,'Segoe UI',sans-serif;overflow:hidden;}
body{display:flex;align-items:center;justify-content:center;position:relative;}
/* Grille et nappe, comme dans l'ouverture et le radar. */
.grille{position:absolute;inset:0;background-image:linear-gradient(rgba(56,189,248,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(56,189,248,.06) 1px,transparent 1px);background-size:64px 64px;
  mask:radial-gradient(ellipse at center,#000 30%,transparent 75%);-webkit-mask:radial-gradient(ellipse at center,#000 30%,transparent 75%);
  animation:derive 12s linear infinite;}
@keyframes derive{to{background-position:64px 64px;}}
.nappe{position:absolute;inset:-20%;background:radial-gradient(circle at 30% 40%,rgba(240,160,32,.14),transparent 45%),radial-gradient(circle at 70% 60%,rgba(56,189,248,.12),transparent 45%);
  filter:blur(40px);animation:respire 8s ease-in-out infinite alternate;}
@keyframes respire{from{transform:scale(1) rotate(0);}to{transform:scale(1.08) rotate(3deg);}}
.cercle{position:absolute;left:50%;top:50%;width:min(80vh,80vw);aspect-ratio:1;border:1px solid rgba(56,189,248,.18);border-radius:50%;transform:translate(-50%,-50%) scale(.6);opacity:0;
  animation:onde 3.4s cubic-bezier(.2,.7,.2,1) .2s forwards;}
.cercle.c2{animation-delay:.6s;} .cercle.c3{animation-delay:1s;}
@keyframes onde{0%{transform:translate(-50%,-50%) scale(.6);opacity:0;}20%{opacity:.8;}100%{transform:translate(-50%,-50%) scale(1.25);opacity:0;}}

.carte{position:relative;text-align:center;max-width:1300px;padding:0 60px;}
.sur{font-size:22px;letter-spacing:.42em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:28px;
  opacity:0;animation:monte .8s cubic-bezier(.2,.8,.2,1) .25s forwards;}
h1{font-size:104px;line-height:1.02;letter-spacing:-.035em;font-weight:720;margin:0;color:#f3f7fb;
  text-shadow:0 2px 30px rgba(56,189,248,.18);}
h1 .mot{display:inline-block;opacity:0;transform:translateY(40px) rotate(2deg);filter:blur(6px);
  animation:mot .9s cubic-bezier(.2,.8,.2,1) forwards;}
@keyframes mot{to{opacity:1;transform:none;filter:none;}}
.sous{font-size:30px;color:var(--muted);margin-top:30px;font-weight:450;letter-spacing:-.01em;
  opacity:0;animation:monte .9s cubic-bezier(.2,.8,.2,1) 1.1s forwards;}
@keyframes monte{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:none;}}
.trait{width:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);margin:34px auto 0;
  animation:trait 1.2s cubic-bezier(.2,.8,.2,1) .9s forwards;}
@keyframes trait{to{width:360px;}}
.sortie{position:absolute;inset:0;background:var(--bg);opacity:0;pointer-events:none;}
body.fin .sortie{animation:fondu .5s ease forwards;}
@keyframes fondu{to{opacity:1;}}
/* Carton final : logo + points clés */
.logo{display:inline-flex;align-items:center;gap:22px;margin-bottom:26px;opacity:0;animation:monte .8s cubic-bezier(.2,.8,.2,1) .2s forwards;}
.logo svg{width:76px;height:76px;color:var(--accent);}
.logo b{font-size:44px;letter-spacing:-.03em;font-weight:700;}
.points{display:flex;gap:46px;justify-content:center;margin-top:40px;color:var(--muted);font-size:24px;}
.points span{opacity:0;animation:monte .7s cubic-bezier(.2,.8,.2,1) forwards;}
.points span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent2);margin-right:12px;vertical-align:middle;}
</style>
</head>
<body>
<div class="nappe"></div><div class="grille"></div>
<div class="cercle"></div><div class="cercle c2"></div><div class="cercle c3"></div>
<div class="carte" id="carte"></div>
<div class="sortie"></div>
<script>
const q = new URLSearchParams(location.search);
const carte = document.getElementById('carte');
const mots = (texte, retard = .35) => texte.split(' ').map((m, i) => `<span class="mot" style="animation-delay:${(retard + i * .11).toFixed(2)}s">${m}</span>`).join(' ');
const sur = q.get('sur') ?? '';
const titre = q.get('titre') ?? '';
const sous = q.get('sous') ?? '';
if (q.get('type') === 'fin') {
  const points = (q.get('points') ?? '').split('|').filter(Boolean);
  carte.innerHTML = `<div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5 5-2Z"/></svg><b>Job Cockpit</b></div>
    <h1>${mots(titre, .5)}</h1>
    ${sous ? `<div class="sous" style="animation-delay:1.3s">${sous}</div>` : ''}
    <div class="points">${points.map((p, i) => `<span style="animation-delay:${(1.7 + i * .25).toFixed(2)}s">${p}</span>`).join('')}</div>`;
} else {
  carte.innerHTML = `${sur ? `<div class="sur">${sur}</div>` : ''}<h1>${mots(titre)}</h1>${sous ? `<div class="sous">${sous}</div>` : ''}<div class="trait"></div>`;
}
// Fondu de sortie déclenché par le pilote : document.body.classList.add('fin')
</script>
</body>
</html>
