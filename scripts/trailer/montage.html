<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Montage</title>
<style>
@font-face{font-family:'Inter Variable';src:url(cartons/fonts/inter-latin-wght-normal.woff2) format('woff2-variations');font-weight:100 900;}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#080b10;font-family:'Inter Variable',Inter,'Segoe UI',sans-serif;color:#e4edf4;}
#scene{position:relative;width:1920px;height:1080px;}
canvas{position:absolute;left:0;top:0;}
#dom{position:absolute;inset:0;}
#vignette{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.42) 100%);}
/* ── légendes ── */
.legende{position:absolute;display:flex;align-items:center;gap:14px;padding:14px 26px 14px 20px;border-radius:999px;
  background:rgba(8,11,16,.78);border:1px solid rgba(56,189,248,.35);backdrop-filter:blur(8px);
  color:#f3f7fb;font-size:30px;font-weight:560;letter-spacing:-.01em;white-space:nowrap;
  box-shadow:0 10px 40px -10px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.3);transform-origin:left center;}
.legende i{width:12px;height:12px;border-radius:50%;background:#f0a020;box-shadow:0 0 18px #f0a020;flex-shrink:0;}
.legende.touche{padding:12px 18px;gap:10px;}
.legende kbd{font:inherit;font-size:26px;padding:4px 14px;border-radius:10px;background:#141a22;border:1px solid rgba(255,255,255,.18);
  border-bottom-width:3px;color:#fff;}
/* ── cartons ── */
.carton{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#080b10;overflow:hidden;}
.carton .nappe{position:absolute;inset:-20%;filter:blur(50px);
  background:radial-gradient(circle at 30% 40%,rgba(240,160,32,.16),transparent 45%),radial-gradient(circle at 70% 60%,rgba(56,189,248,.14),transparent 45%);}
.carton .grille{position:absolute;inset:0;background-image:linear-gradient(rgba(56,189,248,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(56,189,248,.07) 1px,transparent 1px);background-size:64px 64px;
  -webkit-mask:radial-gradient(ellipse at center,#000 25%,transparent 72%);mask:radial-gradient(ellipse at center,#000 25%,transparent 72%);}
.carton .onde{position:absolute;left:50%;top:50%;width:900px;height:900px;border:1px solid rgba(56,189,248,.22);border-radius:50%;}
.carton .texte{position:relative;text-align:center;max-width:1500px;}
.carton .sur{font-size:26px;letter-spacing:.42em;text-transform:uppercase;color:#f0a020;font-weight:620;margin-bottom:30px;}
.carton h1{font-size:118px;line-height:1.02;letter-spacing:-.04em;font-weight:740;margin:0;color:#f6f9fc;text-shadow:0 2px 40px rgba(56,189,248,.2);}
.carton h1 .mot{display:inline-block;}
.carton .sous{font-size:34px;color:#8b9bab;margin-top:32px;font-weight:450;}
.carton .trait{height:2px;background:linear-gradient(90deg,transparent,#f0a020,transparent);margin:36px auto 0;}
.carton .logo{display:inline-flex;align-items:center;gap:24px;margin-bottom:30px;}
.carton .logo svg{width:84px;height:84px;color:#f0a020;}
.carton .logo b{font-size:50px;letter-spacing:-.03em;font-weight:700;}
.carton .points{display:flex;gap:52px;justify-content:center;margin-top:44px;color:#8b9bab;font-size:27px;}
.carton .points span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:#38bdf8;margin-right:13px;vertical-align:middle;}
/* ── chiffres ── */
.chiffres{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:120px;background:#080b10;}
.chiffres .nappe,.chiffres .grille{position:absolute;inset:0;}
.chiffre{position:relative;text-align:center;}
.chiffre b{display:block;font-size:168px;font-weight:760;letter-spacing:-.05em;line-height:1;color:#f6f9fc;font-variant-numeric:tabular-nums;
  text-shadow:0 2px 50px rgba(56,189,248,.25);}
.chiffre b.accent{color:#f0a020;text-shadow:0 2px 50px rgba(240,160,32,.35);}
.chiffre span{display:block;margin-top:18px;font-size:30px;letter-spacing:.3em;text-transform:uppercase;color:#8b9bab;font-weight:600;}
</style>
</head>
<body>
<div id="scene">
  <canvas id="c" width="1920" height="1080"></canvas>
  <div id="dom"></div>
  <div id="vignette"></div>
</div>
<script src="donnees.js"></script>
<script src="plan.js"></script>
<script src="moteur.js"></script>
</body>
</html>
